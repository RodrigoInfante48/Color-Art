name: Niveles y deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_levels:
        description: 'Regenerar todos los niveles aunque no haya cambios en levels-src/'
        type: boolean
        default: false

# Un solo deploy a la vez; no se cancela uno en curso para no dejar Pages a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  levels:
    name: Generar niveles
    runs-on: ubuntu-latest
    permissions:
      contents: write # para hacer commit de levels/
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ¿Cambiaron las imágenes o el pipeline?
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          FORCE: ${{ inputs.rebuild_levels }}
        run: |
          if [ "$FORCE" = "true" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Sin commit previo comparable o ejecución forzada: se regeneran los niveles."
          elif git diff --name-only "$BEFORE" HEAD | grep -qE '^(levels-src/|tools/|package(-lock)?\.json$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            git diff --name-only "$BEFORE" HEAD | grep -E '^(levels-src/|tools/)' || true
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "levels-src/ no cambió: se usan los niveles ya commiteados."
          fi

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.build == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Instalar y generar
        if: steps.changes.outputs.build == 'true'
        run: |
          npm ci
          npm test
          npm run levels

      - name: Commit de los niveles generados
        id: commit
        run: |
          if [ -n "$(git status --porcelain -- levels/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add levels/
            git commit -m "chore(levels): regenerar niveles [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Publicar en Pages
    needs: levels
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.levels.outputs.sha }} # incluye el commit de niveles recién hecho

      - name: Armar sitio (solo archivos del juego)
        run: |
          mkdir -p _site
          cp -r index.html favicon.svg css js levels _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
